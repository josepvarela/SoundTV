<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundTV</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="$WEBAPIS/webapis/webapis.js" onerror="console.warn('Tizen no disponible')"></script>
</head>
<body>
    <!-- Menú Lateral -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="icon.png" alt="SoundTV Logo" class="logo-img">
            <span class="logo-text">SoundTV</span>
        </div>
        <ul id="sidebar-menu">
            <li class="active" data-section="followed" tabindex="0">Seguidos</li>
            <li data-section="games" tabindex="0">Juegos Seguidos</li>
            <li data-section="past" tabindex="0">Transmisiones Pasadas</li>
            <li data-section="channels" tabindex="0">Canales Seguidos</li>
            <li data-section="top" tabindex="0">Juegos Populares</li>
            <li data-section="settings" tabindex="0">Configuración</li>
        </ul>
    </aside>

    <!-- Contenido Principal -->
    <main class="main-content">
        <header class="top-bar">
            <h1 id="viewer-count">Cargando...</h1>
            <span class="status-dot" id="status"></span>
        </header>

        <section class="stream-grid" id="stream-container"></section>

        <div id="loading" class="loading-message">Cargando streams de Twitch...</div>
    </main>

    <script src="app.js"></script>
</body>
</html>
