<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reproductor Twitch</title>
    <link rel="stylesheet" href="style.css">
    <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body class="player-body">
    <iframe
        id="twitchPlayer"
        src=""
        allowfullscreen
        frameborder="0">
    </iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const channel = urlParams.get('channel') || 'forsen';

        // ⚠️ Reemplaza 'tu-app.vercel.app' por tu dominio real
        const parent = window.location.hostname;

        document.getElementById('twitchPlayer').src =
            `https://player.twitch.tv/?channel=${channel}&parent=${parent}&autoplay=true`;

        // Botón Atrás del mando
        document.addEventListener('keydown', function (e) {
            if (e.keyCode === 10009) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
